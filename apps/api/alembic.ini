# Alembic configuration for LAKSHYA.
#
# The database URL is intentionally NOT stored here. It is read from
# LAKSHYA_MIGRATION_DATABASE_URL (preferred) or LAKSHYA_DATABASE_URL by
# alembic/env.py so that no credential is ever committed.

[alembic]
script_location = alembic
prepend_sys_path = .

# Alembic 1.16 renamed ``version_path_separator`` to ``path_separator`` and warns
# when neither is set, falling back to legacy splitting on spaces, commas and
# colons — which would mis-parse any path containing a space. This repository
# lives under "Stavya Spine Hospital", so the legacy behaviour is not merely
# deprecated here, it is wrong.
path_separator = os

# Deterministic, reviewable file names: 0001_slug.py, 0002_slug.py, ...
# Revision identifiers are assigned by hand, not generated, so migration order
# is stable and reviewable (DATABASE.md §9).
file_template = %%(rev)s_%%(slug)s

timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
