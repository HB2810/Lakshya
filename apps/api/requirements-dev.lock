# LAKSHYA API — frozen runtime + development dependencies.
#
# Superset of requirements.lock, adding pytest, ruff and mypy for CI and local
# work. Regenerate the same way, installing `.[dev]` instead of `.`:
#
#   /tmp/lockenv/bin/python -m pip install '.[dev]'
#   /tmp/lockenv/bin/python -m pip freeze --exclude-editable \
#       | grep -vi '^lakshya' | sort > requirements-dev.lock
#
# Install with:  pip install --no-deps -r requirements-dev.lock

