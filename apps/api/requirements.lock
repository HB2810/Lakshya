# LAKSHYA API — frozen runtime dependencies.
#
# Generated, not hand-edited. `pyproject.toml` remains the source of truth for
# which dependencies exist and their supported ranges; this file pins the exact
# resolved versions so an image built today matches one built next month.
#
# Regenerate after changing dependencies in pyproject.toml:
#
#   python -m venv /tmp/lockenv
#   /tmp/lockenv/bin/python -m pip install --upgrade pip
#   /tmp/lockenv/bin/python -m pip install .
#   /tmp/lockenv/bin/python -m pip freeze --exclude-editable \
#       | grep -vi '^lakshya' | sort > requirements.lock
#
# On Windows use .venv\Scripts\python.exe. The lock is resolved in a *clean*
# environment on purpose: freezing the working venv would capture the dev tools
# too, and the API image must not ship pytest, ruff or mypy.
#
# Install with:  pip install --no-deps -r requirements.lock
# `--no-deps` is what makes it a lock rather than a hint — pip installs exactly
# these versions instead of re-resolving.

